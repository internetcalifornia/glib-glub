# Development: everything built from source. `docker compose up -d postgres
# azurite` is the usual shape — the apps run on the host with pnpm dev.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glib_glub
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - '10000:10000'
    volumes:
      - azurite-data:/data

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/glib_glub
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/glib_glub
      VOICE_GATEWAY_URL: ws://localhost:8787
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [full]

  voice-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: voice-gateway
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/glib_glub
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [full]

volumes:
  postgres-data:
  azurite-data:
